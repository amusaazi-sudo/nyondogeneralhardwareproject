<!-- Template: nyondo/templates/customer_delete.html -->
<!-- Use this template for UI pages and content rendering. -->
{% extends 'base.html' %}
{% block content %}

<div class="card shadow-sm" style="max-width: 600px;">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Delete Customer</h4>
            <div class="d-flex gap-2">
                <a href="{% url 'dashboard' %}" class="btn btn-outline-primary">Back to Dashboard</a>
                <a href="{% url 'customer' %}" class="btn btn-outline-secondary">Back</a>
            </div>
        </div>
        {% for msg in messages %}
        <div class="alert alert-{{ msg.tags }} alert-dismissible fade show" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        <p>Are you sure you want to delete <strong>{{ customer.name }}</strong>?</p>
        <form method="POST" novalidate>
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'customer' %}" class="btn btn-secondary ms-2" style="text-decoration: none;">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
