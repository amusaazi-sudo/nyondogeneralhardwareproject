{% extends 'base.html' %}
{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="/nyondogeneralhardware/nyondo/static/salesreg.css">

<div class="container mt-4">
    <h2 class="mb-4">SUPPLIER REGISTRATION FORM</h2>

    {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}

    <form method="post" class="row g-3">
        {% csrf_token %}

        <!-- Supplier Info -->
        <div class="col-md-6">
            <label for="supplier_company" class="form-label">Supplier Company</label>
            <input type="text" class="form-control" id="supplier_company" name="supplier_company" required
                value="{{ data.supplier_company|default:'' }}">
        </div>

        <div class="col-md-6">
            <label for="name" class="form-label">Supplier Name</label>
            <input type="text" class="form-control" id="name" name="name" required value="{{ data.name|default:'' }}">
        </div>

        <div class="col-md-6">
            <label for="phone" class="form-label">Phone</label>
            <input type="text" class="form-control" id="phone" name="phone" required
                value="{{ data.phone|default:'' }}">
        </div>

        <div class="col-md-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ data.email|default:'' }}">
        </div>

        <!-- address removed: not needed at registration -->

        <!-- Supply Record -->
        <div class="col-md-6">
            <label for="product" class="form-label">Product Supplied</label>
            <select id="product" class="form-select" name="product" required>
                <option value="" disabled selected>Choose product...</option>
                <option value="cement" {% if data.product=='cement' %}selected{% endif %}>Cement</option>
                <option value="iron_bars" {% if data.product=='iron_bars' %}selected{% endif %}>Iron Bars</option>
                <option value="nails" {% if data.product=='nails' %}selected{% endif %}>Nails</option>
                <option value="wheelbarrows" {% if data.product=='wheelbarrows' %}selected{% endif %}>Wheelbarrows
                </option>
                <option value="wire_mesh" {% if data.product=='wire_mesh' %}selected{% endif %}>Wire Mesh</option>
                <option value="barbed_wire" {% if data.product=='barbed_wire' %}selected{% endif %}>Barbed Wire</option>
                <option value="iron_sheets" {% if data.product=='iron_sheets' %}selected{% endif %}>Iron Sheets</option>
            </select>
        </div>

        <!-- Specification -->
        <div class="col-md-6">
            <label for="specification" class="form-label">Specification</label>
            <select id="specification" class="form-select" name="specification">
                <option value="" disabled selected>Choose specification...</option>
                {% if data.product == 'cement' %}
                <option value="cem_iin" {% if data.specification=='cem_iin' %}selected{% endif %}>CEM IIN</option>
                <option value="cem_iiin" {% if data.specification=='cem_iiin' %}selected{% endif %}>CEM IIIN</option>
                {% elif data.product == 'iron_bars' %}
                <option value="10mm" {% if data.specification=='10mm' %}selected{% endif %}>10mm</option>
                <option value="12mm" {% if data.specification=='12mm' %}selected{% endif %}>12mm</option>
                <option value="16mm" {% if data.specification=='16mm' %}selected{% endif %}>16mm</option>
                {% elif data.product == 'nails' %}
                <option value="1inch" {% if data.specification=='1inch' %}selected{% endif %}>1 inch</option>
                <option value="3inch" {% if data.specification=='3inch' %}selected{% endif %}>3 inch</option>
                <option value="4inch" {% if data.specification=='4inch' %}selected{% endif %}>4 inch</option>
                <option value="5inch" {% if data.specification=='5inch' %}selected{% endif %}>5 inch</option>
                <option value="roofing_5kg" {% if data.specification=='roofing_5kg' %}selected{% endif %}>Roofing Nails
                    5kg</option>
                {% elif data.product == 'barbed_wire' %}
                <option value="high_tensile" {% if data.specification=='high_tensile' %}selected{% endif %}>High Tensile
                </option>
                <option value="low_tensile" {% if data.specification=='low_tensile' %}selected{% endif %}>Low Tensile
                </option>
                {% elif data.product == 'iron_sheets' %}
                <option value="gauge_28_red" {% if data.specification=='gauge_28_red' %}selected{% endif %}>Gauge 28 -
                    Red</option>
                <option value="gauge_28_blue" {% if data.specification=='gauge_28_blue' %}selected{% endif %}>Gauge 28 -
                    Blue</option>
                <option value="gauge_28_green" {% if data.specification=='gauge_28_green' %}selected{% endif %}>Gauge 28
                    - Green</option>
                <option value="gauge_28_brown" {% if data.specification=='gauge_28_brown' %}selected{% endif %}>Gauge 28
                    - Brown</option>
                <option value="gauge_28_grey" {% if data.specification=='gauge_28_grey' %}selected{% endif %}>Gauge 28 -
                    Grey</option>
                <option value="gauge_30_red" {% if data.specification=='gauge_30_red' %}selected{% endif %}>Gauge 30 -
                    Red</option>
                <option value="gauge_30_blue" {% if data.specification=='gauge_30_blue' %}selected{% endif %}>Gauge 30 -
                    Blue</option>
                <option value="gauge_30_green" {% if data.specification=='gauge_30_green' %}selected{% endif %}>Gauge 30
                    - Green</option>
                <option value="gauge_30_brown" {% if data.specification=='gauge_30_brown' %}selected{% endif %}>Gauge 30
                    - Brown</option>
                <option value="gauge_30_grey" {% if data.specification=='gauge_30_grey' %}selected{% endif %}>Gauge 30 -
                    Grey</option>
                <option value="gauge_32_red" {% if data.specification=='gauge_32_red' %}selected{% endif %}>Gauge 32 -
                    Red</option>
                <option value="gauge_32_blue" {% if data.specification=='gauge_32_blue' %}selected{% endif %}>Gauge 32 -
                    Blue</option>
                <option value="gauge_32_green" {% if data.specification=='gauge_32_green' %}selected{% endif %}>Gauge 32
                    - Green</option>
                <option value="gauge_32_brown" {% if data.specification=='gauge_32_brown' %}selected{% endif %}>Gauge 32
                    - Brown</option>
                <option value="gauge_32_grey" {% if data.specification=='gauge_32_grey' %}selected{% endif %}>Gauge 32 -
                    Grey</option>
                {% endif %}
            </select>
        </div>

        <div class="col-md-6">
            <label for="quantity" class="form-label">Quantity Delivered</label>
            <input type="number" class="form-control" id="quantity" name="quantity" required
                value="{{ data.quantity|default:'' }}">
        </div>

        <div class="col-md-6">
            <label for="deposit" class="form-label">Deposit</label>
            <input type="number" step="0.01" class="form-control" id="deposit" name="deposit" required
                value="{{ data.deposit|default:'' }}">
        </div>

        <!-- selling_price removed: internal pricing, not supplier data -->
        <div class="col-md-6">
            <label for="delivery_date" class="form-label">Delivery Date</label>
            <input type="date" class="form-control" id="delivery_date" name="delivery_date" required
                value="{{ data.delivery_date|default:'' }}">
        </div>

        <!-- Credit -->
        <div class="col-md-6 d-flex align-items-center gap-2 mt-2">
            <input class="form-check-input" type="checkbox" id="is_credit" name="is_credit" {% if data.is_credit
                %}checked{% endif %}>
            <label class="form-check-label" for="is_credit">Supplied on Credit?</label>
        </div>

        <div class="col-md-4">
            <label for="amount_owed" class="form-label">Amount Owed</label>
            <input type="number" step="0.01" class="form-control" id="amount_owed" name="amount_owed"
                value="{{ data.amount_owed|default:'' }}">
        </div>

        <div class="col-md-4">
            <label for="payment_status" class="form-label">Payment Status</label>
            <select id="payment_status" class="form-select" name="payment_status">
                <option value="Pending" {% if data.payment_status=='Pending' %}selected{% endif %}>Pending</option>
                <option value="Partial" {% if data.payment_status=='Partial' %}selected{% endif %}>Partial</option>
                <option value="Paid" {% if data.payment_status=='Paid' %}selected{% endif %}>Paid</option>
            </select>
        </div>

        <div class="col-md-4">
            <label for="due_date" class="form-label">Due Date</label>
            <input type="date" class="form-control" id="due_date" name="due_date"
                value="{{ data.due_date|default:'' }}">
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">SAVE SUPPLIER</button>
        </div>
    </form>
</div>
{% endblock %}
