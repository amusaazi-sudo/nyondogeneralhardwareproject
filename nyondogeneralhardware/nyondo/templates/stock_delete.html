<!-- Template: nyondo/templates/stock_delete.html -->
<!-- Use this template for UI pages and content rendering. -->
{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Delete Stock</h2>
    <div class="d-flex gap-2">
      <a href="{% url 'dashboard' %}" class="btn btn-outline-primary">Back to Dashboard</a>
      <a href="{% url 'stock_dashboard' %}" class="btn btn-outline-secondary">Back</a>
    </div>
  </div>
  {% for message in messages %}
  <div class="alert alert-{{ message.tags }}">{{ message }}</div>
  {% endfor %}
  <p>Are you sure you want to delete <strong>{{ stock.product_name }}</strong>?</p>
  <form method="post" action="{% url 'stock_delete' stock.pk %}" novalidate>
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'stock_dashboard' %}" class="btn btn-secondary" style="text-decoration: none;">Cancel</a>
  </form>
</div>
{% endblock %}
