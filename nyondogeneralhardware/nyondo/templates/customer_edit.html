{% extends 'base.html' %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Edit Customer</h4>
    <a href="{% url 'customer' %}" class="btn btn-sm btn-outline-secondary">Back to Customers</a>
</div>

{% if messages %}
    {% for msg in messages %}
        <div class="alert alert-{{ msg.tags }} alert-dismissible fade show" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
{% endif %}

<div class="card shadow-sm" style="max-width: 600px;">
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Full Name <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control" value="{{ data.name|default:'' }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number <span class="text-danger">*</span></label>
                <input type="text" name="phone" class="form-control" value="{{ data.phone|default:'' }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" value="{{ data.email|default:'' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Address</label>
                <input type="text" name="address" class="form-control" value="{{ data.address|default:'' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">NIN (National ID Number)</label>
                <input type="text" name="NIN" class="form-control" value="{{ data.NIN|default:'' }}">
            </div>

            <div class="mb-4 form-check">
                <input type="checkbox" name="bought_on_credit" class="form-check-input" id="creditCheck"
                    {% if data.bought_on_credit %}checked{% endif %}>
                <label class="form-check-label" for="creditCheck">Bought goods on credit</label>
            </div>

            <button type="submit" class="btn-btn-style" style="background-color: #64B5F6; border-color: #64B5F6;">Update Customer</button>
        </form>
    </div>
</div>

{% endblock %}
