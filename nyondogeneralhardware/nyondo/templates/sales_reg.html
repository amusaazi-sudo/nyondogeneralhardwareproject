{% extends 'base.html' %}
{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="/nyondogeneralhardware/nyondo/static/salesreg.css">
<div class="container mt-4">
  <h2 class="mb-4">SALES REGISTER FORM</h2>

  <form method="post" class="row g-3" action="/add_sales/">
    {% csrf_token %}

    <!-- Product Sold -->
    <div class="col-md-6">
      <label for="product_sold" class="form-label">Product Sold</label>
      <input type="text" class="form-control" id="product_sold" name="product_sold" required>
    </div>

    <!-- Date -->
    <div class="col-md-6">
      <label for="date" class="form-label">Date</label>
      <input type="date" class="form-control" id="date" name="date" required>
    </div>

    <!-- Quantity -->
    <div class="col-md-6">
      <label for="quantity" class="form-label">Quantity</label>
      <input type="number" class="form-control" id="quantity_sold" name="quantity_sold" placeholder="e.g. 500 sacks" required>
    </div>

    <!-- Receipt Number -->
    <div class="col-md-6">
      <label for="receipt_number" class="form-label">Receipt Number</label>
      <input type="number" class="form-control" id="receipt_number" name="receipt_number" required>
    </div>

    <!-- Payment Method -->
    <div class="col-md-6">
      <label for="payment_method" class="form-label">Payment Method</label>
      <select id="payment_method" class="form-select" name="payment_method" required>
        <option value="" selected disabled>Choose...</option>
        <option value="mobile money">Mobile Money</option>
        <option value="cash">Cash</option>
        <option value="bank">Bank</option>
      </select>
    </div>

    <!-- Submit Button -->
    <div class="col-12">
      <button type="submit" class="btn btn-primary"><a href="sales.html"></a>SAVE SALE</button>
    </div>
  </form>
</div>
{% endblock %}
