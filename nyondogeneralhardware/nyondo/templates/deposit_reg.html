<!-- deposit form -->
{% extends 'base.html' %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">New Deposit</h4>
    <a href="{% url 'deposits' %}" class="btn btn-secondary btn-sm">← Back</a>
</div>

{% if messages %}
{% for msg in messages %}
<div class="alert alert-{{ msg.tags }} alert-dismissible fade show" role="alert">
    {{ msg }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{% endfor %}
{% endif %}

<div class="card shadow-sm" style="max-width: 650px;">
    <div class="card-header bg-dark text-white">
        <small class="d-block text-center">NYONDO GENERAL HARDWARE LTD — Deposit Scheme</small>
    </div>
    <div class="card-body">
        <form method="POST" novalidate>
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Customer</label>
                    <select name="customer" class="form-select">
                        <option value="">— Select Customer —</option>
                        {% for c in customers %}
                        <option value="{{ c.pk }}" {% if data.customer|stringformat:"s" == c.pk|stringformat:"s" %}selected{% endif %}>{{ c.name }}</option>
                        {% endfor %}
                    </select>
                    <small class="text-muted">Or enter a new customer name below</small>
                    <input type="text" name="customer_manual" class="form-control mt-2" placeholder="Enter customer name" value="{{ data.customer_manual|default:'' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Item</label>
                    <select name="item" class="form-select" required>
                        <option value="">— Select Item —</option>
                        {% for val, label in scheme_items %}
                        <option value="{{ val }}" {% if data.item|stringformat:"s" == val|stringformat:"s" %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Contact</label>
                    <input type="text" name="contact" class="form-control" value="{{ data.contact|default:'' }}" pattern="\+2567[0-9]{8}" placeholder="+2567XXXXXXXX"
                        required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">NIN <span class="text-muted fw-normal">(optional)</span></label>
                    <input type="text" name="NIN" class="form-control" value="{{ data.NIN|default:'' }}" pattern="r'^[A-Z]{2}[0-9]{12}[A-Z]$" maxlength="15" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Deposit Amount (UGX)</label>
                    <input type="number" name="deposit_amount" class="form-control"
                        value="{{ data.deposit_amount|default:'' }}" min="1" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Total Balance (UGX)</label>
                    <input type="number" name="total_balance" class="form-control"
                        value="{{ data.total_balance|default:'' }}" min="0" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Expiry Date</label>
                    <input type="date" name="expiry_date" class="form-control" value="{{ data.expiry_date|default:'' }}"
                        required>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary">Issue Deposit</button>
                <a href="{% url 'deposits' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
