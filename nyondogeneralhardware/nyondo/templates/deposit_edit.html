{% extends "base.html" %}

{% block content %}
<div class="container">
  <div class="container" style="max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);">
    <h4><i class="fas fa-hard-hat"></i> NYONDO GENERAL HARDWARE LTD</h4>
    <p>"Quality meets Hardwork"</p>
    <p>Located at Ssonde, Mukono</p>
    <p>+256 705 643 214 | +256 778 435 256</p>
    <p><strong>EDIT DEPOSIT</strong></p>
    <hr>
<!-- 
    {% if messages %}
      {% for message in messages %}
        <div style="padding: 10px; background: #d4edda; color: #155724; margin-bottom: 10px; border-radius: 4px;">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %} -->

    <form method="POST">
      {% csrf_token %}
      
      <!-- Receipt No and Date -->
      <div style="display: flex; gap: 20px; margin-bottom: 15px;">
        <div style="flex: 1;">
          <label style="font-weight: bold;">Receipt No:</label>
          <input type="text" name="receipt_number" value="{{ deposit.receipt_number }}" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div style="flex: 1;">
          <label style="font-weight: bold;">Date:</label>
          <input type="date" name="date" value="{{ deposit.date|date:'Y-m-d' }}" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
      </div>

      <!-- Customer Name and NIN -->
      <div style="display: flex; gap: 20px; margin-bottom: 15px;">
        <div style="flex: 1;">
          <label style="font-weight: bold;">Customer Name:</label>
          <input type="text" name="customer_name" value="{{ deposit.customer_name }}" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div style="flex: 1;">
          <label style="font-weight: bold;">NIN:</label>
          <input type="text" name="NIN" value="{{ deposit.NIN }}" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
      </div>

      <!-- Contact and Signature -->
      <div style="display: flex; gap: 20px; margin-bottom: 15px;">
        <div style="flex: 1;">
          <label style="font-weight: bold;">Contact:</label>
          <input type="text" name="contact" value="{{ deposit.contact }}" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div style="flex: 1;">
          <label style="font-weight: bold;">Signature:</label>
          <input type="text" name="signature" value="{{ deposit.signature }}" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
      </div>

      <!-- Deposit Amount and Expiry Date -->
      <div style="display: flex; gap: 20px; margin-bottom: 15px;">
        <div style="flex: 1;">
          <label style="font-weight: bold;">Deposit Amount:</label>
          <input type="number" name="deposit_amount" value="{{ deposit.deposit_amount }}" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div style="flex: 1;">
          <label style="font-weight: bold;">Expiry Date:</label>
          <input type="date" name="expiry_date" value="{{ deposit.expiry_date|date:'Y-m-d' }}" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
      </div>

      <!-- Total Balance -->
      <div style="margin-bottom: 15px;">
        <label style="font-weight: bold;">Total Balance:</label>
        <input type="number" name="total_balance" value="{{ deposit.total_balance }}" placeholder="UGX 100,000" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
      </div>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button type="submit" style="flex: 1; background: #28a745; color: #fff; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">UPDATE</button>
        <a href="{% url 'deposit.html' %}" style="flex: 1; background: #6c757d; color: #fff; padding: 10px; text-align: center; text-decoration: none; border-radius: 4px; font-weight: bold;">CANCEL</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
