<!-- COMMENT-HEADER -->
<!-- Template: nyondo/templates/deposit_edit.html -->
<!-- Use this template for UI pages and content rendering. -->
{% extends 'base.html' %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Edit Deposit — <span class="text-muted">{{ deposit.receipt_number }}</span></h4>
    <a href="{% url 'deposits' %}" class="btn btn-secondary btn-sm">← Back</a>
</div>

{% if messages %}
{% for msg in messages %}
<div class="alert alert-{{ msg.tags }} alert-dismissible fade show" role="alert">
    {{ msg }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{% endfor %}
{% endif %}

<div class="card shadow-sm" style="max-width: 650px;">
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Customer</label>
                    <select name="customer" class="form-select" required>
                        {% for c in customers %}
                        <option value="{{ c.pk }}" {% if deposit.customer.pk == c.pk %}selected{% endif %}>{{ c.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Item</label>
                    <select name="item" class="form-select" required>
                        {% for val, label in scheme_items %}
                        <option value="{{ val }}" {% if deposit.item == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Contact</label>
                    <input type="text" name="contact" class="form-control" value="{{ deposit.contact }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">NIN <span class="text-muted fw-normal">(optional)</span></label>
                    <input type="text" name="NIN" class="form-control" value="{{ deposit.NIN|default:'' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Deposit Amount (UGX)</label>
                    <input type="number" name="deposit_amount" class="form-control" value="{{ deposit.deposit_amount }}"
                        min="1" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Total Balance (UGX)</label>
                    <input type="number" name="total_balance" class="form-control" value="{{ deposit.total_balance }}"
                        min="0" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Expiry Date</label>
                    <input type="date" name="expiry_date" class="form-control"
                        value="{{ deposit.expiry_date|date:'Y-m-d' }}" required>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-success">Update</button>
                <a href="{% url 'deposits' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
