<!-- Template: nyondo/templates/login.html -->
<!-- Use this template for UI pages and content rendering. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyondo General Hardware - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #BBDEFB, #64B5F6);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Lucida Sans', Geneva, Verdana, sans-serif;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            width: 350px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 10px;
            font-weight: bold;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 25px;
            font-size: 14px;
        }

        button {
            width: 106%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 25px;
            background-color: rgb(234, 211, 119);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #64B5F6;
        }

        .alert-error {
            color: #842029;
            background: #f8d7da;
            border: 1px solid #f5c2c7;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>
            <i class="fas fa-hard-hat"></i>
            Nyondo General Hardware
        </h1>
        <hr>
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
        <form method="post" novalidate>
            {% csrf_token %}
            <label for="Email">Email:</label>
            <input type="text" id="Email" name="username" placeholder="username" required>

            <label for="Password">Password:</label>
            <input type="password" id="Password" name="password" placeholder="Password" required>

            <button type="submit">LOGIN</button>
        </form>


</body>

</html>
