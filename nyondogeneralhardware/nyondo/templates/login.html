<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyondo General Hardware - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #BBDEFB, #64B5F6);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Lucida Sans', Geneva, Verdana, sans-serif;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            width: 350px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 10px;
            font-weight: bold;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 25px;
            font-size: 14px;
        }

        button {
            width: 106%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 25px;
            background-color: rgb(234, 211, 119);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #64B5F6;
        }

        .manager-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .manager-buttons a {
            flex: 1;
            margin: 5px;
            padding: 12px;
            border-radius: 25px;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            transition: opacity 0.3s ease;
        }

        .sales {
            background-color: #64B5F6;
        }

        .stock {
            background-color: #64B5F6;
        }

        .manager-buttons a:hover {
            opacity: 0.8;
        }

        p {
            margin-top: 15px;
            font-size: 13px;
            color: #555;
        }

        a.signup {
            color: #2196F3;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>
            <i class="fas fa-hard-hat"></i>
            Nyondo General Hardware
        </h1>
        <hr>
        <form>
            <label for="Email">Email:</label>
            <input type="text" id="Email" placeholder="username" required>

            <label for="Password">Password:</label>
            <input type="password" id="Password" placeholder="Password" required>

            <button type="submit">LOGIN</button>
        </form>

        <div class="manager-buttons">
            <a href="sales_dashboard.html" class="sales"> <i class="fas fa-boxes"></i> Sales Manager</a>
            <a href="stock_dashboard.html" class="stock"><i class="fas fa-shield-alt"></i> Stock Manager</a>
        </div>
        <p>Don't have an account? <a href="signup.html" class="signup">Sign up</a></p>
    </div>
</body>

</html>
