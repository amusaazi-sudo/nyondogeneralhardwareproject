{% extends 'base.html' %}

{% block content %}
<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #BBDEFB, #64B5F6);
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 900px;
        margin: auto;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
    }

    h4 {
        text-align: center;
        margin-bottom: 5px;
        color: #333;
    }

    p {
        text-align: center;
        margin: 2px 0;
        color: #555;
    }

    hr {
        margin: 15px 0;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .form-row {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 15px;
    }

    .form-group {
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    label {
        font-weight: bold;
        margin-bottom: 5px;
        color: #444;
    }

    input, select {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
    }

    input:focus {
        outline: none;
        border-color: #64B5F6;
        box-shadow: 0 0 5px rgba(100, 181, 246, 0.5);
    }

    button {
        background: #64B5F6;
        color: #fff;
        padding: 12px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 20px;
        font-size: 16px;
        transition: background 0.3s;
    }

    button:hover {
        background: #0056b3;
    }

    .card-header {
        background-color: #64B5F6;
        color: white;
        padding: 15px;
        border-radius: 8px 8px 0 0;
        text-align: center;
    }

    .card-header h1 {
        margin: 0;
        font-size: 24px;
    }

    .alert {
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 20px;
    }

    .alert-success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }

    .alert-error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
</style>

<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header">
                <h1>Credit Receipt Form</h1>
            </div>
            <div class="card-body">
                <!-- Display messages -->
                <!-- {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %} -->

                <form method="POST" action="{% url 'credit' %}">
                    {% csrf_token %}
                    
                    <!-- Row 1: Receipt Number and Date -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="receipt_number">Receipt Number</label>
                            <input type="text" class="form-control" id="receipt_number" name="receipt_number" required>
                        </div>

                        <div class="form-group">
                            <label for="date">Date</label>
                            <input type="date" class="form-control" id="date" name="date" required>
                        </div>
                    </div>

                    <!-- Row 2: Customer Name and NIN -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="customer_name">Customer Name</label>
                            <input type="text" class="form-control" id="customer_name" name="customer_name" required>
                        </div>

                        <div class="form-group">
                            <label for="nin">NIN (National ID)</label>
                            <input type="text" class="form-control" id="nin" name="nin" required>
                        </div>
                    </div>

                    <!-- Row 3: Contact and Credit Amount -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="contact">Contact</label>
                            <input type="tel" class="form-control" id="contact" name="contact" placeholder="e.g., 0772xxxxxx" required>
                        </div>

                        <div class="form-group">
                            <label for="credit_amount">Credit Amount (UGX)</label>
                            <input type="number" class="form-control" id="credit_amount" name="credit_amount" required min="0">
                        </div>
                    </div>

                    <!-- Row 4: Expiry Date and Remaining Balance -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="expiry_date">Expiry Date</label>
                            <input type="date" class="form-control" id="expiry_date" name="expiry_date">
                        </div>

                        <div class="form-group">
                            <label for="balance">Remaining Balance (UGX)</label>
                            <input type="number" class="form-control" id="balance" name="balance" readonly>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Save Credit
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>

<script>
    // Auto-calculate remaining balance when credit amount is entered
    document.getElementById('credit_amount').addEventListener('input', function() {
        var creditAmount = this.value;
        document.getElementById('balance').value = creditAmount;
    });
</script>
{% endblock %}
