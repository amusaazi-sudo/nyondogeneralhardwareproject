<!-- customer form  -->
{% extends 'base.html' %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Customer Registration</h4>
    <a href="{% url 'customer' %}" class="btn btn-sm btn-outline-secondary">Back to Customers</a>
</div>

{% if messages %}
{% for msg in messages %}
<div class="alert alert-{{ msg.tags }} alert-dismissible fade show" role="alert">
    {{ msg }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{% endfor %}
{% endif %}

<div class="card shadow-sm" style="max-width: 600px;">
    <div class="card-body">
        <form method="POST" novalidate>
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Full Name <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control" value="{{ data.name|default:'' }}" pattern="[A-Za-z][A-Za-z\s'.-]*" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number <span class="text-danger">*</span></label>
                <input type="text" name="phone" class="form-control" value="{{ data.phone|default:'' }}" pattern="\+2567[0-9]{8}" placeholder="+2567XXXXXXXX" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" value="{{ data.email|default:'' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Address</label>
                <input type="text" name="address" class="form-control" value="{{ data.address|default:'' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Distance from store (km)</label>
                <input type="number" min="0" name="address_distance" class="form-control" value="{{ data.address_distance|default:'' }}" placeholder="e.g. 8">
            </div>

            <div class="mb-3">
                <label class="form-label">NIN (National ID Number)</label>
                <input type="text" name="NIN" id="nin" class="form-control" value="{{ form_data.NIN|default:'' }}" pattern= "r'^[A-Z]{2}[0-9]{12}[A-Z]$"  maxlength="15" placeholder="e.g.  CF123219876543A" required>
            </div>

            <div class="mb-4 form-check">
                <input type="checkbox" name="bought_on_credit" class="form-check-input" id="creditCheck" 
                     {% if data.bought_on_credit %}checked{% endif %}>
                <label class="form-check-label" for="creditCheck">Debtor</label>
            </div>

            <button type="submit" class="btn-btn-style"
                style="background-color: #64B5F6; border-color: #64B5F6;">Register Customer</button>
        </form>
    </div>
</div>

{% endblock %}
