{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2 class="mb-4"><i class="bi bi-pencil-square"></i> Edit Record</h2>

    <!-- Edit form -->
    <form method="POST" action="">
        {% csrf_token %}
        
        <!-- Example fields -->
        <div class="mb-3">
            <label for="itemName" class="form-label">Item Name</label>
            <input type="text" class="form-control" id="itemName" name="item_name" value="{{ record.item_name }}" required>
        </div>

        <div class="mb-3">
            <label for="quantity" class="form-label">Quantity</label>
            <input type="number" class="form-control" id="quantity" name="quantity" value="{{ record.quantity }}" required>
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <input type="text" class="form-control" id="price" name="price" value="{{ record.price }}" required>
        </div>

        <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" class="form-control" id="date" name="date" value="{{ record.date|date:'Y-m-d' }}" required>
        </div>

        <!-- Action buttons -->
        <button type="submit" class="btn btn-success"><i class="bi bi-check-circle"></i> Save Changes</button>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancel</a>
    </form>
</div>
{% endblock %}
