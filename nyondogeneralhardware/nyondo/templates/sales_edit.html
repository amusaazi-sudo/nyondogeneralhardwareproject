{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2 class="mb-4"><i class="bi bi-pencil-square"></i> Edit Record</h2>

    <!-- Edit form -->
    <form method="POST" action="{% url 'sales_edit' sale.pk %}">
        {% csrf_token %}
        
        <div class="mb-3">
            <label class="form-label">Product Sold</label>
            <input type="text" class="form-control" name="product_sold" value="{{ sale.product_sold }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Quantity Sold</label>
            <input type="number" class="form-control" name="quantity_sold" value="{{ sale.quantity_sold }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Payment Method</label>
            <input type="text" class="form-control" name="payment_method" value="{{ sale.payment_method }}" required>
        </div>

        <!-- Action buttons -->
        <button type="submit" class="btn btn-success"><i class="bi bi-check-circle"></i> Save Changes</button>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancel</a>
    </form>
</div>
{% endblock %}
