<!-- supplier delete -->
{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Delete Supplier</h4>
    <div class="d-flex gap-2">
      <a href="{% url 'dashboard' %}" class="btn btn-outline-primary">Back to Dashboard</a>
      <a href="{% url 'suppliers' %}" class="btn btn-outline-secondary">Back</a>
    </div>
  </div>
  {% for message in messages %}
  <div class="alert alert-{{ message.tags }}">{{ message }}</div>
  {% endfor %}
  <p>Are you sure you want to delete <strong>{{ supplier.supplier_company }} — {{ supplier.name }}</strong>?</p>
  <form method="post" novalidate>
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'suppliers' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
