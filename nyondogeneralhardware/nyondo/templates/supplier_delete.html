<!-- Template: nyondo/templates/supplier_delete.html -->
<!-- Use this template for UI pages and content rendering. -->
{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h4>Delete Supplier</h4>
  <p>Are you sure you want to delete <strong>{{ supplier.supplier_company }} — {{ supplier.name }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'suppliers' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
