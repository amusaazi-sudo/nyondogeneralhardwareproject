<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyondo General Hardware</title>

    {% load static %}

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Bootstrap Icons CSS (required for bi-* icons) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    {% comment %} App styles: dashboard and overrides {% endcomment %}
    <link rel="stylesheet" href="{% static 'dashboard.css' %}">

    <style>
        body {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }

        .wrapper {
            display: flex;
            flex: 1;
        }

        .sidebar {
            width: 180px;
            background: black;
            color: #fff;
            padding: 20px 10px;
            min-height: 100vh;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #444;
        }

        .sidebar-brand i {
            font-size: 1.8rem;
            color: #64B5F6;
        }

        .sidebar-brand span {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            line-height: 1.2;
            color: #fff;
        }

        .sidebar a {
            display: block;
            padding: 10px;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 8px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #64B5F6;
        }

        .content {
            flex: 1;
            padding: 20px;
            background: #f8f9fa;
        }

        .card {
            background-color: #fff !important;
        }

        footer {
            margin-top: auto;
            background-color: black;
            font-size: 0.75rem;
            padding: 6px 0;
        }
    </style>
</head>

<body>

    <div class="wrapper">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-brand">
                <i class="bi bi-tools"></i>
                <span>Nyondo General<br>Hardware</span>
            </div>
            <h5>Menu</h5>
            <a href="{% url 'dashboard' %}"
                class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"><i
                    class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="{% url 'sales_dashboard' %}"
                class="{% if 'sale' in request.resolver_match.url_name or 'sales' in request.resolver_match.url_name %}active{% endif %}"><i
                    class="bi bi-cart"></i> Sales</a>
            <a href="{% url 'stock_dashboard' %}"
                class="{% if 'stock' in request.resolver_match.url_name %}active{% endif %}"><i
                    class="bi bi-box-seam"></i> Stock</a>
            <a href="{% url 'suppliers' %}"
                class="{% if 'supplier' in request.resolver_match.url_name or 'supply' in request.resolver_match.url_name %}active{% endif %}"><i
                    class="bi bi-people"></i> Suppliers</a>
            <a href="{% url 'customer' %}"
                class="{% if 'customer' in request.resolver_match.url_name %}active{% endif %}"><i
                    class="bi bi-person-lines-fill"></i> Customers</a>
            <a href="{% url 'deposits' %}"
                class="{% if 'deposit' in request.resolver_match.url_name %}active{% endif %}"><i
                    class="bi bi-cash-coin"></i> Deposits</a>


        </div>

        <div class="content">
            {% block content %}
            {% endblock %}
        </div>
    </div>

    <footer class="text-white text-center py-1">
        <p>&copy; 2026 Nyondo General Hardware | By Aliyer Bakers</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
